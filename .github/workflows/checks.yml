name: Tests and Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: node --test tests/excel.test.mjs tests/worker.test.mjs
      - run: node --check web/app.js
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --name PersonnelWeb --add-data "web;web" server.py
      - uses: actions/upload-artifact@v4
        with:
          name: PersonnelWeb-Windows
          path: dist/PersonnelWeb.exe
