name: Publish site to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'cloudflare/**'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Validate application
        run: |
          node --check web/app.js
          node --check web/extensions.js
          node --check web/shifts-ui.js
          node --check web/shifts-model.js
          node --check cloudflare/worker.js
          node --test tests/*.test.mjs
          python -m unittest discover -s tests
      - name: Apply additive database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.92.0 d1 migrations apply personnel-workspace --remote --config cloudflare/wrangler.jsonc
      - name: Publish existing Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.92.0 deploy --config cloudflare/wrangler.jsonc

