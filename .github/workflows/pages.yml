name: Publish frontend to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish redirect to the same-origin application
        run: |
          python - <<'PYREDIRECT'
          from pathlib import Path
          import json
          target='https://personnel-workspace-api.kadrovyi-prostir.workers.dev/'
          folder=Path('_pages');folder.mkdir(exist_ok=True)
          (folder/'index.html').write_text('<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадровий простір</title><script src="redirect.js" defer></script><h1>Кадровий простір</h1><p>Сайт працює на захищеній адресі Cloudflare.</p><a href="'+target+'">Відкрити сайт</a></html>',encoding='utf-8')
          (folder/'redirect.js').write_text('location.replace('+json.dumps(target)+'+location.search+location.hash);',encoding='utf-8')
          PYREDIRECT
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
