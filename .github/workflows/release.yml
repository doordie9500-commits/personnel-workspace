name: Publish Windows update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v2.4.1
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --name PersonnelWeb --add-data "web;web" server.py
      - name: Create update manifest
        shell: python
        run: |
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from server import VERSION
          tag = os.environ['RELEASE_TAG']
          assert tag == 'v'+VERSION, 'Release tag must match server.VERSION'
          file = Path('dist/PersonnelWeb.exe')
          manifest = {'version': VERSION, 'filename': file.name, 'sha256': hashlib.sha256(file.read_bytes()).hexdigest(), 'size': file.stat().st_size}
          Path('dist/update-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG dist/PersonnelWeb.exe dist/update-manifest.json --title "Кадровий простір $env:RELEASE_TAG" --notes "Кадрова вебверсія для PC: авторизація, адмінка, календарі кадрових відсутностей, Excel, резервні копії та автоматичні оновлення EXE з перевіркою SHA-256."
